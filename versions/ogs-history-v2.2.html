<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OGS Game History</title>
<!--
  OGS Game History v2.2 — one self-contained file, no server, no libraries.
  Docs: README.md (how it works), CHANGELOG.md (versions).

  Script layout:
    1. Fetch    getJSON, resolvePlayer, fetchGames      → raw OGS game records
    2. Parse    readDataset, normalise, normaliseAll    → one small object per game
    3. Analyse  analyse, insights                       → every number in the report
    4. Render   tile, card, breakdown, lineChart, stackedBars, render
    5. Wiring   init: buttons, tabs, tooltips, resize
  The report is built only from the dataset { app_version, player, fetched_at, games },
  whether it came from the network or from a saved JSON file.
-->
<style>
  :root {
    color-scheme: light;
    --paper: #f3ecdd; --card: #fcfcfb; --ink: #0b0b0b; --muted: #52514e;
    --line: #dcd6c8; --kaya: #b9822f; --bad: #a23b2c;
    --s1: #2a78d6;      /* wins / main series */
    --s2: #eb6834;      /* reference: expected from ratings */
    --neutral: #c3c2b7; /* losses */
    --track: #e9e6dd;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --paper: #121211; --card: #1a1a19; --ink: #f0efec; --muted: #c3c2b7;
      --line: #383835; --kaya: #d9a34e; --bad: #e66767;
      --s1: #3987e5; --s2: #d95926; --neutral: #6b6a64; --track: #2c2c2a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font: 600 1.7rem/1.2 Georgia, "Times New Roman", serif; margin: 0 0 4px; text-wrap: balance; }
  h1 .stone { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--ink); margin-right: .35em; }
  h1 small { font: 500 .75rem system-ui, sans-serif; color: var(--muted); margin-left: .5em; vertical-align: middle; }
  h2 { font: 600 1.05rem/1.3 Georgia, serif; margin: 0 0 10px; }
  h3.sec { font: 600 .78rem system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
           color: var(--muted); margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; min-width: 0; }
  #user { flex: 1 1 200px; } #limit { width: 130px; }
  button, .filebtn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 7px; padding: 9px 15px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper); margin: 0; display: inline-block; font-size: .95rem; }
  button.ghost, .filebtn { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, .filebtn:focus-visible, input:focus-visible { outline: 2px solid var(--kaya); outline-offset: 2px; }
  #status { margin: 12px 0 0; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--bad); }
  progress { width: 100%; height: 6px; margin-top: 8px; accent-color: var(--kaya); }

  .tabs { display: flex; gap: 6px; margin: 0 0 6px; border-bottom: 1px solid var(--line);
          position: sticky; top: 0; z-index: 5; background: var(--paper); }
  .chip { display: inline-block; font: 600 .68rem/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase;
          padding: 4px 7px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; white-space: nowrap;
          border: 1px solid var(--line); color: var(--muted); }
  .chip.ranked { border-color: var(--kaya); color: var(--ink); background: color-mix(in srgb, var(--kaya) 18%, transparent); }
  .chip.same { border-style: dashed; }
  .banner { border-left: 4px solid var(--line); padding: 8px 12px; margin: 12px 0 16px; font-size: .92rem; background: var(--card); border-radius: 0 8px 8px 0; }
  .banner.ranked { border-left-color: var(--kaya); }
  .tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
                 border-radius: 0; padding: 10px 14px; font-weight: 600; }
  .tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--kaya); }
  .tabs button span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .tile .k { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font: 600 1.5rem/1.2 Georgia, serif; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .d { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
  .grid2 .card { margin: 0; min-width: 0; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; }
  td { padding: 6px; border-top: 1px solid var(--line); white-space: nowrap; }
  td.num, th.num { text-align: right; }
  .bar { position: relative; width: 90px; height: 8px; background: var(--track); border-radius: 4px; }
  .bar i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
  .bar b { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--s2); border-radius: 1px; margin-left: -1px; }
  .scroll { overflow-x: auto; }
  .win { font-weight: 600; } .dim { color: var(--muted); }
  tr.few .rate, tr.few .bar { opacity: .45; }
  a { color: inherit; text-decoration-color: var(--kaya); }
  svg { display: block; max-width: 100%; touch-action: pan-y; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin: -4px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .note { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
  .form { display: flex; flex-wrap: wrap; gap: 4px; }
  .form span { width: 22px; height: 22px; border-radius: 50%; font: 600 .7rem/22px system-ui, sans-serif; text-align: center; }
  .form .w { background: var(--s1); color: #fff; }
  .form .l { border: 1.5px solid var(--neutral); color: var(--muted); line-height: 19px; }
  ul.insights { margin: 0; padding-left: 1.1em; } ul.insights li { margin: 4px 0; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--paper);
         font-size: .78rem; line-height: 1.35; padding: 6px 9px; border-radius: 6px; max-width: 240px; white-space: pre-line; display: none; }
  #out { margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="stone"></span>OGS game history <small>v2.2</small></h1>
  <p class="sub">Fetch a player's finished games from online-go.com, save them as JSON, and read two reports: all games, and ranked games only. Everything runs in your browser.</p>

  <div class="card">
    <form id="form">
      <label for="user">OGS username (or numeric player ID)</label>
      <div class="row">
        <input type="text" id="user" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <input type="number" id="limit" min="1" placeholder="Max games" aria-label="Maximum games to fetch (blank for all)">
        <button id="go">Fetch games</button>
        <button type="button" class="ghost" id="stop" hidden>Stop</button>
      </div>
    </form>
    <div class="row" style="margin-top:10px">
      <button type="button" class="ghost" id="save" disabled>Save JSON file</button>
      <button type="button" class="ghost" id="update" disabled>Update with new games</button>
      <label class="filebtn" tabindex="0">Load JSON file<input type="file" id="file" accept=".json,application/json" hidden></label>
    </div>
    <progress id="prog" hidden></progress>
    <p id="status" role="status"></p>
  </div>

  <div id="out"></div>
</div>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
const APP_VERSION = "2.2";
const API = "https://online-go.com/api/v1";
const PAGE_SIZE = 100;
const MIN_N = 15;                       // smallest group an "insight" will talk about
const PROVISIONAL_DEV = 160;             // opponents with a rating deviation above this are too uncertain to compare against
const SESSION_GAP_MIN = 60;             // a new game starting within this many minutes continues a session
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= 1. Fetch ================= */
async function getJSON(url, signal) {
  for (let attempt = 0; ; attempt++) {
    const res = await fetch(url, { signal, headers: { Accept: "application/json" } });
    if (res.status === 429 && attempt < 6) {            // rate limited: back off and retry
      const ra = parseFloat(res.headers.get("Retry-After"));
      await sleep((ra > 0 ? ra : 5 * (attempt + 1)) * 1000);
      continue;
    }
    if (res.status >= 502 && res.status <= 504 && attempt < 3) { await sleep(3000 * (attempt + 1)); continue; }   // brief server hiccup
    if (!res.ok) throw new Error("OGS returned HTTP " + res.status);
    return res.json();
  }
}

async function resolvePlayer(q, signal) {
  if (/^\d+$/.test(q)) {
    const p = await getJSON(`${API}/players/${q}/`, signal);
    return { id: p.id, username: p.username };
  }
  const d = await getJSON(`${API}/players/?username=${encodeURIComponent(q)}`, signal);
  const list = d.results || [];
  const p = list.find(r => String(r.username).toLowerCase() === q.toLowerCase()) || list[0];
  if (!p) throw new Error(`No OGS player named "${q}"`);
  return { id: p.id, username: p.username };
}

// Pages through finished games, newest first, appending to `games`.
// With `known` (a Set of game ids already held) it stops at the first page containing a known game,
// so an update costs one or two requests instead of the whole history.
async function fetchGames(player, limit, signal, games, onProgress, known) {
  let url = `${API}/players/${player.id}/games/?page_size=${PAGE_SIZE}&ordering=-ended&ended__isnull=false`;
  while (url) {
    const d = await getJSON(url, signal), res = d.results || [];
    if (known) {
      const fresh = res.filter(g => !known.has(g.id));
      games.push(...fresh); onProgress(games.length, null);
      if (fresh.length < res.length) break;
    } else {
      games.push(...res);
      if (limit && games.length >= limit) { games.length = limit; onProgress(games.length, limit); break; }
      onProgress(games.length, limit ? Math.min(limit, d.count) : d.count);
    }
    url = d.next ? d.next.replace(/^http:/, "https:") : null;
    if (url) await sleep(350);                           // be polite to the API
  }
}

/* ================= 2. Parse ================= */
function readDataset(raw) {
  // Accepts the file this page saves (v1 or v2), a raw API page ({results:[…]}), or a bare array of games.
  const games = Array.isArray(raw) ? raw : (raw.games || raw.results || []);
  let player = raw.player && raw.player.id != null ? raw.player : null;
  if (!player) {                                         // infer: the id that appears in the most games
    const seen = new Map();
    for (const g of games) for (const c of ["black", "white"]) {
      const p = sideOf(g, c);
      if (p.id == null) continue;
      const e = seen.get(p.id) || { id: p.id, username: p.username, n: 0 };
      e.n++; seen.set(p.id, e);
    }
    const top = [...seen.values()].sort((a, b) => b.n - a.n)[0];
    if (top) player = { id: top.id, username: top.username || "player " + top.id };
  }
  return { player, fetched_at: raw.fetched_at || null, games };
}

function sideOf(g, c) {
  const p = g.players && g.players[c];
  if (p && typeof p === "object") return { id: p.id, username: p.username, ui: p.ui_class || "" };
  const v = g[c];
  if (v && typeof v === "object") return { id: v.id, username: v.username, ui: v.ui_class || "" };
  return { id: v, username: null, ui: "" };
}

function speedOf(g) {
  if (g.speed) return g.speed;
  try {
    const p = typeof g.time_control_parameters === "string" ? JSON.parse(g.time_control_parameters) : g.time_control_parameters;
    if (p && p.speed) return p.speed;
  } catch (e) { /* fall through */ }
  const t = g.time_per_move;
  if (!t) return "unknown";
  return t < 10 ? "blitz" : t < 3600 ? "live" : "correspondence";
}

function outcomeOf(s) {
  s = String(s || "").toLowerCase();
  if (s.includes("resign")) return "Resignation";
  if (s.includes("time")) return "Timeout";
  if (s.includes("point")) return "Points";
  if (s.includes("cancel")) return "Cancellation";
  if (s.includes("disconn")) return "Disconnection";
  if (s.includes("moderator") || s.includes("decision")) return "Moderator decision";
  return s ? "Other" : "Unknown";
}

function ratingOf(g, c) {
  const hr = g.historical_ratings && g.historical_ratings[c];
  const r = hr && hr.ratings && hr.ratings.overall ? hr.ratings.overall.rating : null;
  return typeof r === "number" ? r : null;
}

function devOf(g, c) {
  const hr = g.historical_ratings && g.historical_ratings[c];
  const d = hr && hr.ratings && hr.ratings.overall ? hr.ratings.overall.deviation : null;
  return typeof d === "number" ? d : null;
}

function normalise(g, pid) {
  if (g.rengo) return null;                              // team games: no single winner for this player
  const b = sideOf(g, "black"), w = sideOf(g, "white");
  const color = b.id == pid ? "black" : w.id == pid ? "white" : null;
  if (!color) return null;
  const other = color === "black" ? "white" : "black";
  const meLost = g[color + "_lost"], oppLost = g[other + "_lost"];
  let result = "none";
  if (g.annulled) result = "annulled";
  else if (oppLost && !meLost) result = "win";
  else if (meLost && !oppLost) result = "loss";
  const opponent = color === "black" ? w : b;
  const started = g.started ? new Date(g.started) : null, ended = g.ended ? new Date(g.ended) : null;
  return {
    id: g.id, color, result, opponent,
    bot: /\bbot\b/.test(opponent.ui),
    ranked: !!g.ranked,
    size: g.width && g.height ? `${g.width}×${g.height}` : "unknown",
    speed: speedOf(g),
    handicap: g.handicap > 0,
    source: g.tournament ? "Tournament" : g.ladder ? "Ladder" : "Regular",
    outcome: outcomeOf(g.outcome),
    started, ended,
    minutes: started && ended ? (ended - started) / 60000 : null,
    rating: ratingOf(g, color), oppRating: ratingOf(g, other),
    oppProvisional: (devOf(g, other) || 0) > PROVISIONAL_DEV,
  };
}

function normaliseAll(dataset) {
  const pid = dataset.player ? dataset.player.id : null;
  const seen = new Set();                                // paging can repeat a game if one finishes mid-fetch
  return dataset.games.filter(g => g && !seen.has(g.id) && seen.add(g.id)).map(g => normalise(g, pid)).filter(Boolean)
    .sort((a, b) => (a.ended ? a.ended.getTime() : 0) - (b.ended ? b.ended.getTime() : 0));
}

/* ================= 3. Analyse ================= */
function tally(list) {
  let w = 0, l = 0;
  for (const g of list) { if (g.result === "win") w++; else if (g.result === "loss") l++; }
  return { games: list.length, w, l, rate: w + l ? w / (w + l) : null };
}
function groupBy(list, keyFn, order) {
  const m = new Map();
  for (const g of list) { const k = keyFn(g); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(g); }
  const rows = [...m.entries()].map(([key, items]) => ({ key, ...tally(items) }));
  if (order) return order.filter(k => m.has(k)).map(k => rows.find(r => r.key === k));
  return rows.sort((a, b) => b.games - a.games);
}
const cap = s => s[0].toUpperCase() + s.slice(1);
const expected = (me, opp) => 1 / (1 + Math.pow(10, (opp - me) / 400));   // Elo-style approximation
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

const DIFF_BANDS = ["Much weaker (150+ below)", "Weaker (50–150 below)", "Similar (within 50)", "Stronger (50–150 above)", "Much stronger (150+ above)"];
const diffBand = d => DIFF_BANDS[d <= -150 ? 0 : d < -50 ? 1 : d <= 50 ? 2 : d < 150 ? 3 : 4];
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const BLOCKS = ["Night (00–06)", "Morning (06–12)", "Afternoon (12–18)", "Evening (18–24)"];
const LENGTHS = ["Under 10 min", "10–20 min", "20–40 min", "Over 40 min"];
const lengthBand = m => LENGTHS[m < 10 ? 0 : m < 20 ? 1 : m < 40 ? 2 : 3];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function timeline(decided) {
  const dated = decided.filter(g => g.ended);
  if (!dated.length) return { unit: "month", buckets: [] };
  const mi = d => d.getFullYear() * 12 + d.getMonth();
  const a = mi(dated[0].ended), b = mi(dated[dated.length - 1].ended), span = b - a + 1;
  const step = span <= 36 ? 1 : span <= 120 ? 3 : 12;
  const label = k => { const y = Math.floor(k * step / 12), m = (k * step) % 12;
    return step === 1 ? `${MONTHS[m]} ${y}` : step === 3 ? `Q${m / 3 + 1} ${y}` : String(y); };
  const buckets = [];
  for (let k = Math.floor(a / step); k <= Math.floor(b / step); k++) buckets.push({ k, label: label(k), w: 0, l: 0 });
  for (const g of dated) { const bk = buckets[Math.floor(mi(g.ended) / step) - buckets[0].k]; g.result === "win" ? bk.w++ : bk.l++; }
  return { unit: step === 1 ? "month" : step === 3 ? "quarter" : "year", buckets };
}

function analyse(all, player, scope) {
  const decided = all.filter(g => g.result === "win" || g.result === "loss");
  const overall = tally(decided);

  // streaks
  let bestW = 0, bestL = 0, run = 0, prev = null;
  for (const g of decided) { run = g.result === prev ? run + 1 : 1; prev = g.result;
    if (g.result === "win") bestW = Math.max(bestW, run); else bestL = Math.max(bestL, run); }
  const streak = { bestW, bestL, current: decided.length ? run : 0, currentType: prev };

  // rolling win rate
  const win = decided.length >= 200 ? 50 : decided.length >= 60 ? 20 : 10;
  const rolling = []; let acc = 0;
  for (let i = 0; i < decided.length; i++) {
    acc += decided[i].result === "win" ? 1 : 0;
    if (i >= win) acc -= decided[i - win].result === "win" ? 1 : 0;
    if (i >= win - 1) rolling.push({ x: i + 1, y: acc / win, d: decided[i].ended });
  }

  // ratings
  const rated = all.filter(g => g.ranked && g.rating != null && g.ended);
  const ratings = rated.map(g => ({ x: g.ended.getTime(), y: g.rating }));
  let peak = null; for (const p of ratings) if (!peak || p.y > peak.y) peak = p;

  // performance against rating expectation (even games with both ratings known)
  const cmp = decided.filter(g => g.rating != null && g.oppRating != null && !g.handicap && !g.oppProvisional);
  let expWins = 0, gapSum = 0; const bandExp = new Map();
  for (const g of cmp) { const e = expected(g.rating, g.oppRating); expWins += e; gapSum += g.oppRating - g.rating;
    const k = diffBand(g.oppRating - g.rating); const o = bandExp.get(k) || { s: 0, n: 0 }; o.s += e; o.n++; bandExp.set(k, o); }
  const strength = groupBy(cmp, g => diffBand(g.oppRating - g.rating), DIFF_BANDS)
    .map(r => ({ ...r, expected: bandExp.get(r.key).s / bandExp.get(r.key).n }));
  const cmpTally = tally(cmp);
  let bestWin = null;
  for (const g of decided) if (g.result === "win" && g.oppRating != null && !g.oppProvisional && (!bestWin || g.oppRating > bestWin.oppRating)) bestWin = g;

  // opponents
  const opp = new Map();
  for (const g of decided) { const k = g.opponent.id;
    if (!opp.has(k)) opp.set(k, { name: g.opponent.username || "player " + k, items: [] }); opp.get(k).items.push(g); }

  // time of day / week (viewer's local time zone)
  const dated = decided.filter(g => g.ended);
  const hours = Array.from({ length: 24 }, (_, h) => ({ label: String(h).padStart(2, "0") + ":00", w: 0, l: 0 }));
  const timed = dated.filter(g => g.speed !== "correspondence");      // a correspondence game's end time says little about when it was played
  const todLive = timed.length >= MIN_N, tod = todLive ? timed : dated;
  for (const g of tod) { const h = hours[g.ended.getHours()]; g.result === "win" ? h.w++ : h.l++; }

  // game length, real-time games only
  const live = decided.filter(g => g.speed !== "correspondence" && g.minutes != null && g.minutes > 0 && g.minutes < 600);

  // colour × board size
  const sizes = groupBy(decided, g => g.size);
  const colorBySize = sizes.map(s => {
    const items = decided.filter(g => g.size === s.key);
    return { key: s.key, black: tally(items.filter(g => g.color === "black")), white: tally(items.filter(g => g.color === "white")) };
  });

  // regular opponents (5+ decided games): toughest and easiest
  const oppRows = [...opp.values()].map(o => ({ key: o.name, ...tally(o.items) }));
  const regulars = oppRows.filter(o => o.w + o.l >= 5);
  const hardest = [...regulars].sort((a, b) => a.rate - b.rate || b.games - a.games).slice(0, 5);
  const easiest = [...regulars].sort((a, b) => b.rate - a.rate || b.games - a.games).slice(0, 5);

  // sessions and momentum, real-time games only
  const rt = decided.filter(g => g.speed !== "correspondence" && g.started && g.ended).sort((a, b) => a.started - b.started);
  const MOM = ["First game of a session", "After a win", "After a loss", "After 2+ losses in a row"];
  const POS = ["1st game", "2nd game", "3rd game", "4th game or later"];
  const momB = MOM.map(() => []), posB = POS.map(() => []);
  let pg = null, pos = 0, lossRun = 0, sessions = 0;
  for (const g of rt) {
    const cont = pg && g.started - pg.ended < SESSION_GAP_MIN * 60000;
    if (!cont) { pos = 0; lossRun = 0; sessions++; momB[0].push(g); }
    else { momB[pg.result === "win" ? 1 : 2].push(g); if (lossRun >= 2) momB[3].push(g); }
    posB[Math.min(pos, 3)].push(g); pos++;
    lossRun = g.result === "loss" ? lossRun + 1 : 0; pg = g;
  }
  const rowsOf = (keys, b) => keys.map((key, i) => ({ key, ...tally(b[i]) })).filter(r => r.games);

  // playing habits (every finished game in scope, decided or not)
  const allDated = all.filter(g => g.ended), perDay = new Map();
  for (const g of allDated) { const d = g.ended, k = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
    const e = perDay.get(k) || { n: 0, d }; e.n++; perDay.set(k, e); }
  let busiest = null; for (const e of perDay.values()) if (!busiest || e.n > busiest.n) busiest = e;
  let brk = null;
  for (let i = 1; i < allDated.length; i++) { const ms = allDated[i].ended - allDated[i - 1].ended;
    if (!brk || ms > brk.ms) brk = { ms, from: allDated[i - 1].ended, to: allDated[i].ended }; }
  const spanDays = allDated.length > 1 ? (allDated[allDated.length - 1].ended - allDated[0].ended) / 864e5 : 0;
  const habits = allDated.length ? { activeDays: perDay.size, perActiveDay: allDated.length / perDay.size,
    perWeek: spanDays >= 7 ? allDated.length / (spanDays / 7) : null, busiest, brk,
    sessions, perSession: sessions ? rt.length / sessions : null } : null;

  // notable games
  let upset = null, shock = null, longest = null, quickest = null;
  for (const g of cmp) { const gap = g.oppRating - g.rating;
    if (g.result === "win" && gap > 0 && (!upset || gap > upset.gap)) upset = { g, gap };
    if (g.result === "loss" && gap < 0 && (!shock || gap < shock.gap)) shock = { g, gap }; }
  for (const g of live) { if (!longest || g.minutes > longest.minutes) longest = g;
    if (g.result === "win" && (!quickest || g.minutes < quickest.minutes)) quickest = g; }
  const who = g => `${g.opponent.username || "player " + g.opponent.id}${g.oppRating != null ? " (" + rankStr(g.oppRating) + ")" : ""}`;
  const notable = [
    bestWin && { label: "Strongest opponent beaten", text: `${who(bestWin)}, rated ${Math.round(bestWin.oppRating)}`, g: bestWin },
    upset && { label: "Biggest upset win", text: `${who(upset.g)}, ${Math.round(upset.gap)} points above you`, g: upset.g },
    shock && { label: "Most surprising loss", text: `${who(shock.g)}, ${Math.round(-shock.gap)} points below you`, g: shock.g },
    longest && { label: "Longest live game", text: `${Math.round(longest.minutes)} min against ${who(longest)}`, g: longest },
    quickest && { label: "Quickest live win", text: `${Math.max(1, Math.round(quickest.minutes))} min against ${who(quickest)}`, g: quickest },
  ].filter(Boolean);

  // rating change within each calendar year (ranked games)
  const yr = new Map();
  for (const g of rated) { const y = String(g.ended.getFullYear()), e = yr.get(y) || { first: g.rating }; e.last = g.rating; yr.set(y, e); }

  const s = {
    scope, player, total: all.length, overall,
    annulled: all.filter(g => g.result === "annulled").length,
    noResult: all.filter(g => g.result === "none").length,
    first: all.find(g => g.ended) || null, last: all[all.length - 1] || null,
    color: groupBy(decided, g => g.color === "black" ? "As Black" : "As White", ["As Black", "As White"]),
    ranked: groupBy(decided, g => g.ranked ? "Ranked" : "Unranked", ["Ranked", "Unranked"]),
    size: sizes, colorBySize,
    speed: groupBy(decided, g => cap(g.speed)),
    handicap: groupBy(decided, g => g.handicap ? "Handicap" : "Even"),
    source: groupBy(decided, g => g.source),
    versus: groupBy(decided, g => g.bot ? "Bots" : "Humans", ["Humans", "Bots"]),
    winsBy: groupBy(decided.filter(g => g.result === "win"), g => g.outcome),
    lossesBy: groupBy(decided.filter(g => g.result === "loss"), g => g.outcome),
    years: groupBy(dated, g => String(g.ended.getFullYear())).sort((a, b) => a.key.localeCompare(b.key)),
    weekdays: groupBy(tod, g => DAYS[(g.ended.getDay() + 6) % 7], DAYS),
    blocks: groupBy(tod, g => BLOCKS[Math.floor(g.ended.getHours() / 6)], BLOCKS),
    hours,
    lengths: groupBy(live, g => lengthBand(g.minutes), LENGTHS),
    medianMinutes: median(live.map(g => g.minutes)),
    timeline: timeline(decided),
    opponents: [...oppRows].sort((a, b) => b.games - a.games).slice(0, 10),
    distinctOpponents: opp.size,
    streak, rolling, rollingWindow: win, ratings, peak,
    strength, perf: { n: cmp.length, wins: cmpTally.w, expWins },
    bestWin, hardest, easiest, notable, habits, todLive,
    momentum: rowsOf(MOM, momB), sessionPos: rowsOf(POS, posB),
    avgGap: cmp.length ? gapSum / cmp.length : null,
    form: decided.slice(-20).map(g => g.result),
    recent: all.slice(-30).reverse(),
  };
  for (const r of s.years) { const e = yr.get(r.key); r.dr = e ? e.last - e.first : null; }
  s.insights = insights(s);
  return s;
}

function insights(s) {
  const out = [], p = r => (r * 100).toFixed(1) + "%";
  const ok = rows => rows.filter(r => r.w + r.l >= MIN_N && r.rate != null);
  const extremes = rows => { const o = ok(rows).sort((a, b) => b.rate - a.rate); return o.length >= 2 ? [o[0], o[o.length - 1]] : null; };

  const c = ok(s.color);
  if (c.length === 2 && Math.abs(c[0].rate - c[1].rate) >= 0.03) {
    const [hi, lo] = c[0].rate > c[1].rate ? c : [c[1], c[0]];
    out.push(`Stronger ${hi.key.replace("As", "as")}: ${p(hi.rate)} against ${p(lo.rate)} ${lo.key.replace("As", "as")}.`);
  }
  if (s.perf.n >= MIN_N) {
    const d = s.perf.wins - s.perf.expWins;
    out.push(`Against rating expectation in ${s.perf.n} even games: ${s.perf.wins} wins where the ratings predicted about ${s.perf.expWins.toFixed(0)} (${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(0)}).`);
  }
  const up = ok(s.strength.filter(r => r.key.startsWith("Stronger") || r.key.startsWith("Much stronger")));
  if (up.length) { const w = up.reduce((a, r) => a + r.w, 0), n = up.reduce((a, r) => a + r.w + r.l, 0);
    out.push(`Against higher-rated opponents (50+ points above): ${w} wins in ${n} games (${p(w / n)}).`); }
  for (const [rows, what] of [[s.size, "board size"], [s.speed, "game speed"], [s.blocks, "time of day"], [s.weekdays, "day of the week"]]) {
    const e = extremes(rows);
    if (e && e[0].rate - e[1].rate >= 0.05) out.push(`Best ${what}: ${e[0].key} at ${p(e[0].rate)}; weakest: ${e[1].key} at ${p(e[1].rate)}.`);
  }
  if (s.form.length === 20 && s.overall.rate != null) {
    const f = s.form.filter(r => r === "win").length / 20, d = f - s.overall.rate;
    if (Math.abs(d) >= 0.1) out.push(`Recent form is ${d > 0 ? "above" : "below"} the long-run average: ${p(f)} over the last 20 games against ${p(s.overall.rate)} overall.`);
  }
  if (s.avgGap != null && s.perf.n >= MIN_N && Math.abs(s.avgGap) >= 15)
    out.push(`Opponents in even games averaged ${Math.abs(s.avgGap).toFixed(0)} rating points ${s.avgGap > 0 ? "above" : "below"} this player.`);
  const aw = s.momentum.find(r => r.key === "After a win"), al = s.momentum.find(r => r.key === "After a loss");
  if (aw && al && aw.w + aw.l >= MIN_N && al.w + al.l >= MIN_N && Math.abs(aw.rate - al.rate) >= 0.05)
    out.push(`Within a session, the win rate is ${p(aw.rate)} straight after a win and ${p(al.rate)} straight after a loss.`);
  const to = s.lossesBy.find(r => r.key === "Timeout");
  if (to && s.overall.l >= MIN_N && to.games / s.overall.l >= 0.2) out.push(`${p(to.games / s.overall.l)} of losses were on time (${to.games} of ${s.overall.l}).`);
  if (s.peak && s.ratings.length >= MIN_N) {
    const now = s.ratings[s.ratings.length - 1].y;
    out.push(`Peak rating ${Math.round(s.peak.y)} (${rankStr(s.peak.y)}) on ${fmtDate(new Date(s.peak.x))}; latest ${Math.round(now)} (${rankStr(now)}).`);
  }
  return out;
}

/* ================= 4. Render ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = r => r == null ? "–" : (r * 100).toFixed(1) + "%";
function fmtDate(d) { return d ? d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "–"; }
function rankStr(rating) { const r = Math.floor(Math.log(rating / 525) * 23.15); return r < 30 ? (30 - r) + "k" : (r - 29) + "d"; }
const wl = r => `${r.w} W – ${r.l} L`;

function tile(k, v, d) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d || "&nbsp;"}</div></div>`; }
let scopeChip = "";
function card(title, body, note, chip) { return `<div class="card"><h2>${title}${chip || scopeChip}</h2>${body}${note ? `<p class="note">${note}</p>` : ""}</div>`; }

const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(Math.round(n));
function breakdown(title, rows, o = {}) {
  if (!rows.length) return "";
  const few = r => !o.noFade && r.w + r.l < MIN_N ? ` class="few" title="Fewer than ${MIN_N} decided games"` : "";
  const body = rows.map(r => o.countOnly
    ? `<tr><td>${esc(r.key)}</td><td class="num">${r.games}</td><td class="num">${pct(r.games / o.total)}</td></tr>`
    : `<tr${few(r)}><td>${esc(r.key)}</td><td class="num">${r.games}</td><td class="num">${r.w}–${r.l}</td><td class="num rate">${pct(r.rate)}</td>
       ${o.expected ? `<td class="num">${pct(r.expected)}</td>` : ""}${o.extra ? `<td class="num">${o.extra.fn(r)}</td>` : ""}
       <td><div class="bar"><i style="width:${(r.rate || 0) * 100}%"></i>${o.expected ? `<b style="left:${r.expected * 100}%"></b>` : ""}</div></td></tr>`).join("");
  const head = o.countOnly ? `<th>${o.col || ""}</th><th class="num">Games</th><th class="num">Share</th>`
    : `<th>${o.col || ""}</th><th class="num">Games</th><th class="num">W–L</th><th class="num">Win rate</th>${o.expected ? `<th class="num">Expected</th>` : ""}${o.extra ? `<th class="num">${o.extra.head}</th>` : ""}<th></th>`;
  return card(title, `${o.legend || ""}<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`, o.note);
}

/* ---- charts (inline SVG, drawn at the container's real width) ---- */
const lineData = {}; let chartSeq = 0;
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * mag, t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) t.push(v);
  return t;
}
function lineChart(pts, o) {
  if (pts.length < 2) return `<p class="note">Not enough games to draw this yet.</p>`;
  const W = o.width, H = 210, L = 46, R = 14, T = 12, B = 26;
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  let lo = Infinity, hi = -Infinity; for (const p of pts) { if (p.y < lo) lo = p.y; if (p.y > hi) hi = p.y; }
  if (o.domain) [lo, hi] = o.domain; else { const pad = Math.max((hi - lo) * 0.08, 10); lo -= pad; hi += pad; }
  const X = x => L + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (W - L - R);
  const Y = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  const ticks = o.ticks || niceTicks(lo, hi, 4);
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/>
    <text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${o.yFmt(v)}</text>`).join("");
  const ref = o.ref != null ? `<line x1="${L}" x2="${W - R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--muted)" stroke-dasharray="4 4"/>` : "";
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join("");
  const id = "lc" + (++chartSeq);
  lineData[id] = { pts: pts.map(p => ({ px: X(p.x), py: Y(p.y), tip: o.tip(p) })), W };
  return `<svg id="${id}" data-line width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">
    ${grid}${ref}<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--muted)" visibility="hidden"/>
    <circle class="dot" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
    <text x="${L}" y="${H - 6}">${esc(o.xLeft)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(o.xRight)}</text>
  </svg>`;
}
function stackedBars(buckets, o) {
  const n = buckets.length; if (!n) return "";
  const W = o.width, H = 190, L = 34, R = 8, T = 10, B = 24;
  let max = 1; for (const b of buckets) max = Math.max(max, b.w + b.l);
  const ticks = niceTicks(0, max, 3).filter(v => Number.isInteger(v)); max = Math.max(max, ticks[ticks.length - 1] || max);
  const slot = (W - L - R) / n, bw = Math.max(1, Math.min(28, slot - (slot > 6 ? 2 : 0.5)));
  const Y = v => T + (1 - v / max) * (H - T - B), base = Y(0);
  const every = Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 70)));
  let bars = "", labels = "";
  buckets.forEach((b, i) => {
    const x = L + i * slot + (slot - bw) / 2, hw = base - Y(b.w), hl = base - Y(b.l), gap = b.w && b.l && hw > 3 ? 2 : 0;
    const tot = b.w + b.l, tip = `${b.label}\n${tot} games · ${b.w}–${b.l}${tot ? " · " + pct(b.w / tot) : ""}`;
    if (b.w) bars += `<rect x="${x.toFixed(1)}" y="${(base - hw).toFixed(1)}" width="${bw.toFixed(1)}" height="${hw.toFixed(1)}" rx="${Math.min(2, bw / 2)}" fill="var(--s1)"/>`;
    if (b.l) bars += `<rect x="${x.toFixed(1)}" y="${(base - hw - hl).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, hl - gap).toFixed(1)}" rx="${Math.min(2, bw / 2)}" fill="var(--neutral)"/>`;
    bars += `<rect x="${(L + i * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`;
    if (i % every === 0) labels += `<text x="${(L + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.short ? o.short(b.label) : b.label)}</text>`;
  });
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/>
    <text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Wins</span><span><i style="background:var(--neutral)"></i>Losses</span></div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}${bars}${labels}</svg>`;
}

function render(state) {
  const out = document.getElementById("out");
  const all = state.scope === "ranked" ? state.games.filter(g => g.ranked) : state.games;
  const nAll = state.games.length, nRanked = state.games.filter(g => g.ranked).length;
  const tabs = `<div class="tabs" role="tablist" aria-label="Report scope">
      <button role="tab" data-scope="all" aria-selected="${state.scope === "all"}">All games <span>${nAll.toLocaleString()}</span></button>
      <button role="tab" data-scope="ranked" aria-selected="${state.scope === "ranked"}">Ranked only <span>${nRanked.toLocaleString()}</span></button></div>`;
  const head = `<h2 style="font-size:1.3rem;margin-bottom:8px">${esc(state.player.username)}</h2>${tabs}`;
  if (!all.length) { out.innerHTML = head + `<div class="card" style="margin-top:16px">No ${state.scope === "ranked" ? "ranked " : ""}finished games found for this player.</div>`; return; }

  const s = analyse(all, state.player, state.scope);
  const isAll = state.scope === "all";
  scopeChip = isAll ? `<span class="chip">All games</span>` : `<span class="chip ranked">Ranked only</span>`;
  const sameChip = `<span class="chip same">Same in both reports</span>`;
  const share = nAll ? Math.round(nRanked / nAll * 100) : 0;
  const banner = `<div class="banner ${isAll ? "" : "ranked"}"><strong>${isAll ? "All games report" : "Ranked-only report"}.</strong> ${
    isAll ? `Everything below counts all ${nAll.toLocaleString()} games, ranked and unranked together.`
          : `Everything below counts only the ${nRanked.toLocaleString()} ranked games; the ${(nAll - nRanked).toLocaleString()} unranked games are left out.`}
    Ranked games are ${share}% of this history${share >= 80 ? ", so the two reports will look alike" : ""}. Each card is labelled with what it counts.</div>`;
  const full = Math.max(260, out.clientWidth - 34), half = out.clientWidth >= 700 ? Math.floor((out.clientWidth - 16) / 2) - 34 : full;
  const find = (rows, k) => rows.find(r => r.key === k) || { games: 0, w: 0, l: 0, rate: null };
  const blk = find(s.color, "As Black"), wht = find(s.color, "As White");
  const lastRating = s.ratings.length ? s.ratings[s.ratings.length - 1].y : null;
  const extras = [s.annulled && `${s.annulled} annulled`, s.noResult && `${s.noResult} with no winner`].filter(Boolean).join(", ");
  const curr = s.streak.current ? `now: ${s.streak.current} ${s.streak.currentType === "win" ? "win" : "loss"}${s.streak.current > 1 ? (s.streak.currentType === "win" ? "s" : "es") : ""} in a row` : "";

  const tiles = [
    tile("Win rate", pct(s.overall.rate), wl(s.overall)),
    tile("As Black", pct(blk.rate), wl(blk)),
    tile("As White", pct(wht.rate), wl(wht)),
    isAll ? tile("Ranked", pct(find(s.ranked, "Ranked").rate), wl(find(s.ranked, "Ranked"))) : "",
    isAll ? tile("Unranked", pct(find(s.ranked, "Unranked").rate), wl(find(s.ranked, "Unranked"))) : "",
    lastRating != null ? tile("Rating", Math.round(lastRating), "≈ " + rankStr(lastRating)) : "",
    s.peak ? tile("Peak rating", Math.round(s.peak.y), `${rankStr(s.peak.y)} · ${fmtDate(new Date(s.peak.x))}`) : "",
    tile("Best win streak", s.streak.bestW, curr),
    tile("Longest losing run", s.streak.bestL, ""),
    s.bestWin ? tile("Strongest win", Math.round(s.bestWin.oppRating), `${esc(s.bestWin.opponent.username || "")} · ${rankStr(s.bestWin.oppRating)}`) : "",
    tile("Opponents", s.distinctOpponents.toLocaleString(), "different players"),
    s.medianMinutes != null ? tile("Typical live game", Math.round(s.medianMinutes) + " min", "median length") : "",
  ].join("");

  const form = s.form.length ? card(`Last ${s.form.length} results`, `<div class="form" aria-label="Most recent results, oldest first">${
    s.form.map(r => `<span class="${r === "win" ? "w" : "l"}">${r === "win" ? "W" : "L"}</span>`).join("")}</div>`, "Oldest on the left, newest on the right.") : "";
  const ins = s.insights.length ? card("What stands out", `<ul class="insights">${s.insights.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`,
    `Only groups with at least ${MIN_N} decided games are mentioned.`) : "";

  const tl = s.timeline, unitShort = l => tl.unit === "month" ? l.replace(/ (\d\d)(\d\d)$/, " ’$2") : l;
  const colorSize = s.colorBySize.length ? card("Colour by board size", `<div class="scroll"><table><thead><tr><th>Board</th><th class="num">Black W–L</th><th class="num">Black</th><th class="num">White W–L</th><th class="num">White</th></tr></thead><tbody>${
    s.colorBySize.map(r => `<tr><td>${esc(r.key)}</td><td class="num">${r.black.w}–${r.black.l}</td><td class="num">${pct(r.black.rate)}</td><td class="num">${r.white.w}–${r.white.l}</td><td class="num">${pct(r.white.rate)}</td></tr>`).join("")}</tbody></table></div>`) : "";

  const todNote = (s.todLive ? "Real-time games only. " : "") + "Your browser's local time zone.";
  const link = g => `<a href="https://online-go.com/game/${encodeURIComponent(g.id)}" target="_blank" rel="noopener">View</a>`;
  const notable = s.notable.length ? card("Notable games", `<div class="scroll"><table><tbody>${
    s.notable.map(n => `<tr><td class="dim">${n.label}</td><td>${esc(n.text)}</td><td>${fmtDate(n.g.ended)}</td><td>${link(n.g)}</td></tr>`).join("")}</tbody></table></div>`,
    "Rating comparisons use even games against opponents with a settled rating.") : "";
  const h = s.habits, kv = (k, v) => `<tr><td class="dim">${k}</td><td class="num">${v}</td></tr>`;
  const habits = h ? card("Playing habits", `<div class="scroll"><table><tbody>
      ${kv("Days with a finished game", h.activeDays.toLocaleString())}
      ${kv("Games per active day", h.perActiveDay.toFixed(1))}
      ${h.perWeek != null ? kv("Games per week, whole period", h.perWeek.toFixed(1)) : ""}
      ${h.busiest ? kv("Busiest day", `${h.busiest.n} games · ${fmtDate(h.busiest.d)}`) : ""}
      ${h.brk ? kv("Longest break", `${Math.round(h.brk.ms / 864e5)} days · from ${fmtDate(h.brk.from)}`) : ""}
      ${h.sessions ? kv("Real-time sessions", h.sessions.toLocaleString()) : ""}
      ${h.perSession ? kv("Games per session", h.perSession.toFixed(1)) : ""}
    </tbody></table></div>`) : "";

  const recent = s.recent.map(g => `<tr>
      <td>${fmtDate(g.ended)}</td><td>${esc(g.opponent.username || g.opponent.id)}${g.oppRating != null ? ` <span class="dim">${rankStr(g.oppRating)}</span>` : ""}</td>
      <td>${g.color === "black" ? "● Black" : "○ White"}</td><td>${esc(g.size)}</td>${isAll ? `<td>${g.ranked ? "Ranked" : "Unranked"}</td>` : ""}
      <td class="${g.result === "win" ? "win" : ""}">${{ win: "Win", loss: "Loss", annulled: "Annulled", none: "–" }[g.result]} <span class="dim">· ${esc(g.outcome)}</span></td>
      <td>${link(g)}</td></tr>`).join("");

  out.innerHTML = `${head}
    ${banner}<p class="sub">${s.total.toLocaleString()} finished · ${fmtDate(s.first && s.first.ended)} – ${fmtDate(s.last && s.last.ended)}${extras ? " · " + extras + " (left out of win rates)" : ""}</p>
    <div class="tiles">${tiles}</div>

    <h3 class="sec">Trend</h3>
    <div class="grid2">${form}${ins}</div>
    ${s.ratings.length >= 2 ? card("Rating over time (ranked games)", lineChart(s.ratings, { width: full, label: "Rating at the time of each game",
        yFmt: v => Math.round(v), tip: p => `${fmtDate(new Date(p.x))}\nRating ${Math.round(p.y)} (${rankStr(p.y)})`,
        xLeft: fmtDate(new Date(s.ratings[0].x)), xRight: fmtDate(new Date(s.ratings[s.ratings.length - 1].x)) }),
        "Drawn from ranked games in both reports, because unranked games do not change the rating.", sameChip) : ""}
    ${card(`Rolling win rate (last ${s.rollingWindow} games)`, lineChart(s.rolling, { width: full, label: "Win rate over a moving window of games",
        domain: [0, 1], ticks: [0, .25, .5, .75, 1], ref: .5, yFmt: v => Math.round(v * 100) + "%",
        tip: p => `Game ${p.x}${p.d ? " · " + fmtDate(p.d) : ""}\n${pct(p.y)} over the previous ${s.rollingWindow}`,
        xLeft: "Game " + (s.rolling[0] ? s.rolling[0].x : ""), xRight: "Game " + (s.rolling.length ? s.rolling[s.rolling.length - 1].x : "") }),
        "Each point is the share of wins in the preceding window. The dashed line is 50%.")}
    ${card(`Games per ${tl.unit}`, stackedBars(tl.buckets, { width: full, label: `Wins and losses per ${tl.unit}`, short: unitShort }))}

    <h3 class="sec">Opponents</h3>
    ${breakdown("Results by opponent strength", s.strength, { col: "Opponent rating vs yours", expected: true,
        legend: `<div class="legend"><span><i style="background:var(--s1)"></i>Actual win rate</span><span><i style="background:var(--s2)"></i>Expected from ratings</span></div>`,
        note: "Even games where both ratings are known. Expected is an Elo-style estimate from the rating gap; it ignores rating uncertainty, so treat it as a rough guide." })}
    <div class="grid2">
      ${breakdown("Most frequent opponents", s.opponents, { col: "Opponent", noFade: true })}
      ${s.versus.length > 1 ? breakdown("Humans and bots", s.versus) : ""}
      ${breakdown("Toughest regular opponents", s.hardest, { col: "Opponent", noFade: true, note: "Met at least 5 times; lowest win rate first." })}
      ${breakdown("Best records against regulars", s.easiest, { col: "Opponent", noFade: true, note: "Met at least 5 times; highest win rate first." })}
    </div>
    ${notable}

    <h3 class="sec">Game conditions</h3>
    <div class="grid2">
      ${isAll ? breakdown("Ranked and unranked", s.ranked) : ""}
      ${breakdown("Board size", s.size)}
      ${colorSize}
      ${breakdown("Game speed", s.speed)}
      ${breakdown("Handicap", s.handicap)}
      ${s.source.length > 1 ? breakdown("Game type", s.source) : ""}
      ${breakdown("Live game length", s.lengths, { note: "Real-time games only, start to finish." })}
    </div>

    <h3 class="sec">How games ended</h3>
    <div class="grid2">
      ${breakdown("How wins came", s.winsBy, { countOnly: true, total: s.overall.w })}
      ${breakdown("How losses came", s.lossesBy, { countOnly: true, total: s.overall.l })}
    </div>

    ${s.momentum.length ? `<h3 class="sec">Sessions and momentum</h3>
    <div class="grid2">
      ${breakdown("Result of the game before", s.momentum, { note: `Real-time games only. A session is a run of games each starting within ${SESSION_GAP_MIN} minutes of the last one ending. The last row is part of "After a loss".` })}
      ${breakdown("Game number within a session", s.sessionPos, { note: "Shows whether results hold up or fade as a session goes on." })}
    </div>` : ""}

    <h3 class="sec">When games finished</h3>
    ${card("Hour of day", stackedBars(s.hours, { width: full, label: "Wins and losses by the hour a game ended", short: l => l.slice(0, 2) }), todNote)}
    <div class="grid2">
      ${breakdown("Time of day", s.blocks)}
      ${breakdown("Day of week", s.weekdays)}
      ${breakdown("By year", s.years, { extra: { head: "Rating", fn: r => r.dr == null ? "–" : signed(r.dr) }, note: "Rating: change across that year's ranked games." })}
      ${habits}
    </div>

    <h3 class="sec">Latest games</h3>
    <div class="card"><h2>Most recent ${s.recent.length}${scopeChip}</h2><div class="scroll"><table>
      <thead><tr><th>Ended</th><th>Opponent</th><th>Colour</th><th>Board</th>${isAll ? "<th>Type</th>" : ""}<th>Result</th><th></th></tr></thead>
      <tbody>${recent}</tbody></table></div></div>
    <p class="note">Faded win rates come from fewer than ${MIN_N} decided games: too few to read much into. Win rates leave out annulled games and games with no winner.</p>`;
}

/* ================= 5. Wiring ================= */
function init() {
  const $ = id => document.getElementById(id);
  const out = $("out"), tip = $("tip");
  let dataset = null, state = null, controller = null;

  const status = (msg, err) => { $("status").textContent = msg; $("status").classList.toggle("err", !!err); };
  const draw = () => { if (state) { for (const k in lineData) delete lineData[k]; render(state); } };
  const show = () => {
    $("save").disabled = !dataset || !dataset.games.length;
    $("update").disabled = !dataset || !dataset.player;
    if (!dataset) return;
    state = { player: dataset.player, games: normaliseAll(dataset), scope: state ? state.scope : "all" };
    draw();
  };

  const busy = b => { $("go").disabled = b; $("update").disabled = b || !dataset; $("stop").hidden = !b; $("prog").hidden = !b; if (b) $("prog").removeAttribute("value"); };

  // update = false: fetch a player's history from scratch.
  // update = true:  fetch only games newer than the loaded dataset and put them in front.
  async function run(update) {
    const limit = update ? 0 : (parseInt($("limit").value, 10) || 0);
    const known = update ? new Set(dataset.games.map(g => g.id)) : null;
    const games = []; let player = update ? dataset.player : null, finished = false;
    controller = new AbortController(); busy(true);
    status(update ? `Checking for games newer than the loaded data for ${player.username}…` : "Looking up player…");
    try {
      if (!update) {
        player = await resolvePlayer($("user").value.trim(), controller.signal);
        status(`Found ${player.username} (id ${player.id}). Fetching games…`);
      }
      await fetchGames(player, limit, controller.signal, games, (n, total) => {
        if (total) { $("prog").max = total; $("prog").value = n; }
        status(update ? `Found ${n.toLocaleString()} new games…` : `Fetched ${n.toLocaleString()} of ${(total || n).toLocaleString()} games…`);
      }, known);
      finished = true;
      status(update ? (games.length ? `Added ${games.length.toLocaleString()} new games for ${player.username}. Save the JSON file again to keep them.` : `Already up to date: no new games for ${player.username}.`)
                    : `Done: ${games.length.toLocaleString()} games for ${player.username}. Use "Save JSON file" to keep them.`);
    } catch (err) {
      // A partial update is discarded: keeping it would leave a hole between the new and the old games.
      const kept = update ? " Nothing was added; try the update again." : games.length ? ` Showing the ${games.length.toLocaleString()} games fetched so far.` : "";
      if (err.name === "AbortError") status((update ? "Update stopped." : `Stopped after ${games.length.toLocaleString()} games.`) + (update ? kept : ""));
      else if (err instanceof TypeError) status("Could not reach online-go.com (network problem, or the browser blocked the request)." + kept, true);
      else status(err.message + "." + kept, true);
    } finally { busy(false); }
    if (update) { if (finished && games.length) { dataset = { ...dataset, app_version: APP_VERSION, fetched_at: new Date().toISOString(), games: games.concat(dataset.games) }; show(); } }
    else if (player && games.length) { dataset = { app_version: APP_VERSION, player, fetched_at: new Date().toISOString(), games }; show(); }
  }
  $("form").addEventListener("submit", e => { e.preventDefault(); if ($("user").value.trim()) run(false); });
  $("update").addEventListener("click", () => { if (dataset && dataset.player) run(true); });
  $("stop").addEventListener("click", () => controller && controller.abort());

  $("save").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(dataset, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ogs-${String(dataset.player.username).replace(/[^\w.-]+/g, "_")}-games.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $("file").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      dataset = readDataset(JSON.parse(await f.text()));
      if (!dataset.player) throw new Error("no player found in file");
      status(`Loaded ${dataset.games.length.toLocaleString()} games for ${dataset.player.username} from ${f.name}` +
             (dataset.fetched_at ? ` (fetched ${fmtDate(new Date(dataset.fetched_at))}).` : "."));
      show();
    } catch (err) { status("That file isn't a games JSON this page understands: " + err.message, true); }
    e.target.value = "";
  });
  document.querySelector(".filebtn").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });

  // report tabs
  out.addEventListener("click", e => {
    const b = e.target.closest("[data-scope]"); if (!b || !state) return;
    state.scope = b.dataset.scope; draw();
    const again = out.querySelector(`[data-scope="${state.scope}"]`); if (again) again.focus();
  });

  // tooltips: crosshair on line charts, per-bar on bar charts
  const placeTip = (text, x, y) => {
    tip.textContent = text; tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(6, Math.min(x + 14, innerWidth - r.width - 6)) + "px";
    tip.style.top = Math.max(6, y - r.height - 12) + "px";
  };
  const clearTip = () => {
    tip.style.display = "none";
    out.querySelectorAll("svg[data-line] .xh, svg[data-line] .dot").forEach(n => n.setAttribute("visibility", "hidden"));
  };
  const onMove = e => {
    const svg = e.target.closest && e.target.closest("svg[data-line]");
    if (svg && lineData[svg.id]) {
      const d = lineData[svg.id], r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (d.W / r.width);
      let lo = 0, hi = d.pts.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; d.pts[m].px < px ? lo = m : hi = m; }
      const p = Math.abs(d.pts[lo].px - px) <= Math.abs(d.pts[hi].px - px) ? d.pts[lo] : d.pts[hi];
      const xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot");
      xh.setAttribute("x1", p.px); xh.setAttribute("x2", p.px); xh.setAttribute("visibility", "visible");
      dot.setAttribute("cx", p.px); dot.setAttribute("cy", p.py); dot.setAttribute("visibility", "visible");
      placeTip(p.tip, e.clientX, r.top + p.py * (r.height / 210));
      return;
    }
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) placeTip(t.dataset.tip, e.clientX, e.clientY); else clearTip();
  };
  out.addEventListener("pointermove", onMove);
  out.addEventListener("pointerdown", onMove);
  out.addEventListener("pointerleave", clearTip);
  addEventListener("scroll", clearTip, { passive: true });

  let rt = 0, lastW = out.clientWidth;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (out.clientWidth !== lastW) { lastW = out.clientWidth; draw(); } }, 150); });

  window.__ogsLoad = raw => { dataset = readDataset(raw); show(); };   // hook for testing / console use
}

if (typeof document !== "undefined") init();
if (typeof module !== "undefined") module.exports = { analyse, normaliseAll, readDataset };
</script>
</body>
</html>
